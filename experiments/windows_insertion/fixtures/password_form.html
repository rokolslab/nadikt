<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nadikt controlled password fixture</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; font: 18px system-ui, sans-serif; }
    label { display: block; margin: 1.5rem 0; }
    input { display: block; box-sizing: border-box; width: 100%; padding: .7rem; }
  </style>
</head>
<body>
  <h1>Controlled insertion fixture</h1>
  <label>Normal control A <input id="normal-a" type="text" autocomplete="off"></label>
  <label>Normal control B <input id="normal-b" type="text" autocomplete="off"></label>
  <label>Password control <input id="password" type="password" autocomplete="off"></label>
</body>
</html>
